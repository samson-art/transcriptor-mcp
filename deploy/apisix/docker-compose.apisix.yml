# Overlay: Apache APISIX in standalone mode → upstream mcp:4200 (mcp-proxy).
# apisix.generated.yaml is tracked in git (dev self-signed TLS). Regenerate: deploy/apisix/generate-dev-certs.sh
# If you ever see mount errors, remove a mistaken *directory* named apisix.generated.yaml and git checkout the file.
#
#   docker compose -f docker-compose.yml -f deploy/apisix/docker-compose.apisix.yml up -d
#
# HTTP gateway: 9080  HTTPS: 9443  Prometheus: 9091
# Point clients at https://<host>:9443/... (or terminate TLS elsewhere and use 9080).
# File-driven standalone (data_plane + apisix.yaml) loads routes from the mounted YAML; embedded
# Admin UI on :9180 may be unavailable in this mode—edit apisix.yaml / config.yaml instead.

services:
  apisix:
    image: apache/apisix:3.15.0-debian
    container_name: transcriptor-apisix
    restart: unless-stopped
    depends_on:
      - mcp
    environment:
      APISIX_TLS_SNI: ${APISIX_TLS_SNI:-localhost}
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-dev-admin-key-change-me}
      TIER_FREE_KEY: ${TIER_FREE_KEY:-change-me-tier-free}
      TIER_PRO_KEY: ${TIER_PRO_KEY:-change-me-tier-pro}
      TIER_ENTERPRISE_KEY: ${TIER_ENTERPRISE_KEY:-change-me-tier-enterprise}
      # Absolute URL of Protected Resource Metadata (RFC 9728) on *this* MCP edge host — not the IdP discovery URL.
      # Example: https://transcriptor.comedy.cat/.well-known/oauth-protected-resource
      OAUTH_RESOURCE_METADATA_URL: ${OAUTH_RESOURCE_METADATA_URL:-https://localhost:9443/.well-known/oauth-protected-resource}
      # Optional; appended as scope="..." when non-empty (MCP / OAuth clients).
      OAUTH_WWW_AUTHENTICATE_SCOPE: ${OAUTH_WWW_AUTHENTICATE_SCOPE:-}
      # OAuth / MCP Authorization (RFC 9728 PRM + future JWT validation). See docs/mcp-public-url-contract.md §6.
      # OAUTH_ISSUER: Authentik provider issuer (string in PRM authorization_servers + JWKS discovery base).
      # OAUTH_RESOURCE: Canonical protected resource URL in PRM (RFC 9728). Some clients (e.g. Glama) expect the
      # origin https://<host>/ , not https://<host>/mcp — must match what the OAuth client registered as resource.
      # OAUTH_AUDIENCE: Expected JWT "aud" when enabling jwt-auth on the gateway (often the OAuth client_id in Authentik).
      OAUTH_ISSUER: https://auth.comedy.cat/application/o/transcriptor-auth/
      # Public https URL; not 0.0.0.0 or internal port. Use origin form if the MCP catalog/OAuth client expects it.
      OAUTH_RESOURCE: https://transcriptor.comedy.cat/
      # openid-connect (JWT Bearer): OIDC discovery on the real AS (Authentik). Also used as 302 target for
      # GET /.well-known/oauth-authorization-server on the MCP host (avoids proxying to mcp → HTTP 504).
      OAUTH_DISCOVERY: https://auth.comedy.cat/application/o/transcriptor-auth/.well-known/openid-configuration
      # Required by the plugin schema; used with use_jwks for signature verification (not shared with end-user clients).
      OAUTH_CLIENT_ID: eruvjS1OUT7Gd15LewlFOh6g8JBD2UNX2G0dT2nf
      OAUTH_CLIENT_SECRET: 0lZBGn4NzlZrkFasT2j48UMKCRiYXqvTNykfjez1xIVZ5TMisHLqz3k6b9slpMztojNAKXlPC3kxkJxtbv5jlIaF7WQlXnl0XppluvSuqpI5UccaEJoHuVlBq7kBEUPl
    volumes:
      # Long-form bind + create_host_path: false avoids Docker creating an empty *directory* when the host
      # path is missing (which makes /usr/local/apisix/conf/apisix.yaml a dir and breaks entrypoint).
      - type: bind
        source: ./deploy/apisix/apisix_conf/config.yaml
        target: /usr/local/apisix/conf/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/apisix/apisix_conf/apisix.generated.yaml
        target: /usr/local/apisix/conf/apisix.yaml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9091:9091"
      - "9180:9180"
    networks:
      - default
