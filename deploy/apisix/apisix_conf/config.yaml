#
# APISIX: declarative routes from conf/apisix.yaml (file-driven standalone).
# Per https://apisix.apache.org/docs/apisix/deployment-modes/ — use role `data_plane` +
# `config_provider: yaml` so routes load from the local file. The combination `traditional` +
# `config_provider: yaml` is API-driven standalone (empty config until Admin API updates).
# Admin UI on :9180 is optional in this setup; primary config is the mounted apisix.yaml.
#
# Merge with root docker-compose:
#   docker compose -f docker-compose.yml -f deploy/apisix/docker-compose.apisix.yml up -d
#
apisix:
  node_listen:
    - port: 9080
  enable_ipv6: false
  # Declarative routes come from apisix.yaml; Admin API is not used for route updates in this setup.
  enable_admin: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
  # Required by schema; not used when config_provider is yaml (init_etcd skips etcd).
  etcd:
    host:
      - http://127.0.0.1:2379
    prefix: /apisix
    timeout: 30
    watch_timeout: 50
    startup_retry: 2
    tls:
      verify: true
  admin:
    admin_key_required: true
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY:=dev-admin-key-change-me}}
        role: admin
    enable_admin_cors: true
    enable_admin_ui: true
    # Docker publishes 9180 to the host; client source IP is usually not 127.0.0.1.
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    admin_api_version: v3

plugin_attr:
  prometheus:
    export_addr:
      ip: "0.0.0.0"
      port: 9091

# OpenResty does not expose arbitrary env vars to Lua unless listed here (see serverless PRM / 401 handlers).
nginx_config:
  envs:
    - OAUTH_RESOURCE
    - OAUTH_ISSUER
    - OAUTH_RESOURCE_METADATA_URL
    - OAUTH_WWW_AUTHENTICATE_SCOPE
