<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}}</title>
<link rel="canonical" href="https://transcriptor-mcp.org{{path}}" />
<link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#faf9f6" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta property="og:type" content="article" />
<meta property="og:site_name" content="Transcriptor MCP" />
<meta property="og:title" content="{{title}}" />
<meta property="og:url" content="https://transcriptor-mcp.org{{path}}" />
<meta property="og:image" content="https://transcriptor-mcp.org/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://transcriptor-mcp.org/og-image.png" />
<link rel="preload" href="/fonts/lora-600-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/jetbrains-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face {
    font-family: 'Lora';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('/fonts/lora-600-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/jetbrains-mono-400-latin.woff2') format('woff2');
  }
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --ink: #1f1e1a;
    --muted: #6f6b60;
    --muted-2: #8b867a;
    --line: #e9e6df;
    --line-soft: #f0eee8;
    --accent: #c15f3c;
    --accent-hover: #a04a2c;
    --code-bg: #f2f0ea;
    --dark: #1f1e1a;
    --dark-ink: #f3efe6;
    --serif: 'Lora', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.65 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }
  html { -webkit-tap-highlight-color: transparent; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 60px; }

  header.site {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 34px; padding: 20px 0;
  }
  header.site .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  header.site .brand-mark {
    width: 28px; height: 28px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  header.site .brand-mark::after {
    content: ''; width: 0; height: 0; margin-left: 2px;
    border-left: 9px solid var(--bg);
    border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent;
  }
  header.site .brand-name { font-family: var(--serif); font-weight: 600; font-size: 17px; }

  h1, h2, h3 { font-family: var(--serif); font-weight: 600; }
  h1 { font-size: 30px; line-height: 1.25; letter-spacing: -0.01em; }
  h2 { font-size: 22px; margin-top: 2em; }
  h3 { font-size: 17px; margin-top: 1.6em; }
  code {
    font-family: var(--mono); font-size: 0.86em;
    background: var(--code-bg); padding: 0.12em 0.35em; border-radius: 5px;
    overflow-wrap: anywhere;
  }
  pre {
    background: var(--dark); color: var(--dark-ink);
    padding: 12px 14px; border-radius: 10px; overflow-x: auto;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
  }
  pre code { background: none; padding: 0; font-size: inherit; }
  table { width: 100%; border-collapse: collapse; margin: 1.2em 0; font-size: 15px; }
  th, td { text-align: left; padding: 9px 12px; vertical-align: top; }
  th {
    border-bottom: 1px solid var(--line);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 600;
  }
  td { border-bottom: 1px solid var(--line-soft); }
  blockquote {
    border-left: 3px solid var(--accent); margin: 1.2em 0;
    padding: 0.1em 0 0.1em 16px; color: var(--muted);
  }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }

  footer.site {
    border-top: 1px solid var(--line);
    margin-top: 48px; padding-top: 20px;
    font-size: 14px; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 8px 22px;
  }
  footer.site a { color: var(--muted); }
  footer.site a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Transcriptor</span>
    </a>
  </header>
  <main>
{{content}}
  </main>
  <footer class="site">
    <a href="/">Home</a>
    <a href="/terms">Terms of Service</a>
    <a href="/privacy">Privacy Policy</a>
    <a href="mailto:legal@transcriptor-mcp.org">legal@transcriptor-mcp.org</a>
  </footer>
</div>
</body>
</html>
