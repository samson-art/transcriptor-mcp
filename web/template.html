<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}}</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://transcriptor-mcp.org{{path}}" />
<link rel="icon" type="image/png" href="/icon-512.png" />
<style>
  :root {
    --bg: #f6f8fc;
    --surface: #ffffff;
    --ink: #10152a;
    --muted: #5b6478;
    --line: #dde3ef;
    --accent: #1e66c0;
    --accent-2: #0f766e;
    --code-bg: #eef2f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e1a;
      --surface: #121729;
      --ink: #e9edf7;
      --muted: #8d95ab;
      --line: #232b44;
      --accent: #57a9f2;
      --accent-2: #3fe0c5;
      --code-bg: #0f1425;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px 60px; }
  header.site {
    border-bottom: 1px solid var(--line);
    margin-bottom: 34px; padding: 18px 0;
    display: flex; align-items: center; gap: 12px;
    font-weight: 700;
  }
  header.site img { width: 30px; height: 30px; border-radius: 7px; }
  header.site a { color: var(--ink); text-decoration: none; }
  header.site .tc {
    margin-left: auto; font-weight: 400; font-size: 13px; color: var(--accent-2);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  h1 { font-size: 30px; letter-spacing: -0.015em; line-height: 1.25; }
  h2 { font-size: 21px; margin-top: 2em; letter-spacing: -0.01em; }
  h3 { font-size: 17px; margin-top: 1.6em; }
  code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.88em; background: var(--code-bg);
    padding: 0.12em 0.35em; border-radius: 5px;
    overflow-wrap: anywhere;
  }
  pre { background: var(--code-bg); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 15px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  blockquote { border-left: 3px solid var(--accent-2); margin: 1em 0; padding: 0.1em 0 0.1em 16px; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  footer.site {
    border-top: 1px solid var(--line);
    margin-top: 48px; padding-top: 20px;
    font-size: 14px; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 8px 22px;
  }
  footer.site a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <img src="/logo.webp" alt="" width="30" height="30" />
    <a href="/">Transcriptor&nbsp;MCP</a>
    <span class="tc">{{eyebrow}}</span>
  </header>
  <main>
{{content}}
  </main>
  <footer class="site">
    <a href="/">Home</a>
    <a href="/terms">Terms of Service</a>
    <a href="/privacy">Privacy Policy</a>
    <a href="mailto:legal@transcriptor-mcp.org">legal@transcriptor-mcp.org</a>
  </footer>
</div>
</body>
</html>
