<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — Transcriptor MCP</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #faf9f6;
    --ink: #1f1e1a;
    --line: #e9e6df;
    --accent: #c15f3c;
    --accent-hover: #a04a2c;
    --serif: 'Lora', Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.65 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 60px; }

  header.site {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 34px; padding: 20px 0;
  }
  header.site .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  header.site .brand-mark {
    width: 28px; height: 28px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  header.site .brand-mark::after {
    content: ''; width: 0; height: 0; margin-left: 2px;
    border-left: 9px solid var(--bg);
    border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent;
  }
  header.site .brand-name { font-family: var(--serif); font-weight: 600; font-size: 17px; }

  h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.25; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Transcriptor</span>
    </a>
  </header>
  <main>
    <h1>Page not found</h1>
    <p>That page does not exist. Try the <a href="/">home page</a> or <a href="/support/">Support</a>.</p>
  </main>
</div>
</body>
</html>
