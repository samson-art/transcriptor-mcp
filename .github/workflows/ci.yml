name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run checks (format, lint, typecheck, test, build)
        run: make check-no-smoke

      - name: Coverage totals in the job summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${t[k].pct}% |`);
            console.log(["### Test coverage", "", "| Metric | Covered |", "| --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      # Local hooks can be missing or skipped. This check runs for every push and PR.
      - name: No gitignored or key files in the repo
        run: |
          bad=$(git ls-files -ci --exclude-standard)
          if [ -n "$bad" ]; then echo "::error::These files must stay local:"; echo "$bad"; exit 1; fi
