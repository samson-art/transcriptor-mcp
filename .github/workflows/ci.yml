name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the hook self-check asks GitHub which PR a merge commit belongs to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the hook self-check reads the merge commits of PRs #32 and #43

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run checks (format, lint, typecheck, test, build)
        run: make check-no-smoke

      - name: Coverage totals in the job summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${t[k].pct}% |`);
            console.log(["### Test coverage", "", "| Metric | Covered |", "| --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      # The agent hooks guard secrets and release tags. publish-docker.yml also runs guard-release.mjs.
      # A broken lexer in git-commands.mjs would otherwise show up only at a release.
      # It calls GitHub, so it runs after the gate: a network failure here must not hide the gate result.
      - name: Self-check of the agent hooks
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .claude/hooks/guards.check.mjs

      # Local hooks can be missing or skipped. This check runs for every push and PR,
      # also when an earlier step fails.
      - name: No gitignored or key files in the repo
        if: ${{ !cancelled() }}
        run: |
          bad=$(git ls-files -ci --exclude-standard)
          if [ -n "$bad" ]; then echo "::error::These files must stay local:"; echo "$bad"; exit 1; fi
