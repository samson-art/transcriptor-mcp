# Publish Docker images on: version tag push or manual run. A tag push also creates
# the GitHub Release of the tag (#149). A GitHub Release does not start this workflow.
# A `latest_only` run rebuilds the newest release tag so the baked-in yt-dlp stays
# current; ytdlp-rebuild.yml starts one when PyPI has a newer yt-dlp than :latest.
# Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (or other registry secrets).
name: Publish Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.4.7 or v0.4.7); required unless latest_only'
        required: false
      latest_only:
        description: 'Rebuild the newest v* tag and publish only :latest (fresh yt-dlp, no version tag)'
        required: false
        default: false
        type: boolean

# Queue runs, never abort one that may already have pushed half of its tags.
concurrency:
  group: publish-docker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    # Inputs reach the scripts through env, never as ${{ }} inside run: (#135).
    # On a tag push both are empty.
    env:
      LATEST_ONLY: ${{ inputs.latest_only }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate workflow_dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$LATEST_ONLY" != "true" ]; then
            if [ -z "$INPUT_VERSION" ]; then
              echo "::error::version is required when latest_only is false. Set version or use latest_only=true."
              exit 1
            fi
          fi

      - name: Get ref to build
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$LATEST_ONLY" = "true" ]; then
              # Newest v* tag; runs before checkout, so ask the remote directly.
              tag=$(git ls-remote --tags --refs "${{ github.server_url }}/${{ github.repository }}.git" 'refs/tags/v*' | awk -F/ '{print $NF}' | sort -V | tail -1)
              [ -n "$tag" ] || { echo "::error::no v* tag to rebuild"; exit 1; }
              echo "ref=refs/tags/$tag" >> $GITHUB_OUTPUT
            else
              v="$INPUT_VERSION"
              [ "${v#v}" = "$v" ] && v="v$v"
              echo "ref=refs/tags/$v" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "ref=refs/tags/${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      # Test gate: nothing is pushed unless the checked-out ref passes the same checks as CI.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # v1.4.1 shipped from a merge commit that missed the PR's late review fixes.
      # Stop a tag push before any image push when the merge does not contain the whole PR.
      - name: Tag is a merge commit that contains its whole PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({ tool_input: { command: `git tag ${process.argv[1]} ${process.argv[2]}` } }))' "$TAG" "$(git rev-parse HEAD)" \
            | node .claude/hooks/guard-release.mjs

      - name: Lint, typecheck, unit tests, build (also builds dist/e2e for the smokes below)
        run: make check-no-smoke

      - name: Set up QEMU and buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag and image tags
        id: tag
        run: |
          # A latest_only run republishes only :latest from the newest release tag,
          # so the released :<version> tag stays immutable.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$LATEST_ONLY" = "true" ]; then
            version=$(jq -r .version package.json)
            echo "latest_only=true" >> $GITHUB_OUTPUT
            echo "api_tags=artsamsonov/transcriptor-mcp-api:latest" >> $GITHUB_OUTPUT
            echo "mcp_tags=artsamsonov/transcriptor-mcp:latest" >> $GITHUB_OUTPUT
          else
            echo "latest_only=false" >> $GITHUB_OUTPUT
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              v="$INPUT_VERSION"
            elif [ "${{ github.event_name }}" = "release" ]; then
              v="${{ github.event.release.tag_name }}"
            else
              v="${{ github.ref_name }}"
            fi
            version="${v#v}"
            {
              echo "api_tags<<EOF"
              echo "artsamsonov/transcriptor-mcp-api:$version"
              echo "artsamsonov/transcriptor-mcp-api:latest"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            {
              echo "mcp_tags<<EOF"
              echo "artsamsonov/transcriptor-mcp:$version"
              echo "artsamsonov/transcriptor-mcp:latest"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      # No `cache-from` in this workflow on purpose: a cached pip layer would freeze yt-dlp;
      # each job gets a fresh builder, so `pip install -U yt-dlp` resolves anew.
      # The multi-arch builds below reuse the amd64 layers from this same builder.
      - name: Build MCP image for smoke (amd64, kept local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: mcp
          platforms: linux/amd64
          load: true
          push: false
          tags: transcriptor-mcp:smoke

      # yt-dlp prints the table either way; without curl_cffi every row ends in "(unavailable)".
      - name: Impersonation targets available (curl_cffi)
        run: |
          n=$(docker run --rm transcriptor-mcp:smoke yt-dlp --list-impersonate-targets | grep -Eci '^chrome.*curl_cffi[[:space:]]*$')
          echo "::notice::$n Chrome impersonation targets available"

      - name: MCP smoke (initialize, tools/list, GET→405, stdio; no YouTube)
        run: SMOKE_SKIP_BUILD=1 SMOKE_SKIP_TRANSCRIPT=1 SMOKE_MCP_IMAGE=transcriptor-mcp:smoke npm run test:e2e:mcp

      - name: Build API image for smoke (amd64, kept local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: api
          platforms: linux/amd64
          load: true
          push: false
          tags: transcriptor-mcp-api:smoke

      # /changelogs must return this checkout's CHANGELOG.md, so an image without the file fails here.
      # A dispatch can check out an older tag. Tags without api-checks.ts ignore SMOKE_SKIP_TRANSCRIPT
      # and would call YouTube, so this step skips them.
      # ponytail: drop the if once no tag that a dispatch can rebuild is older than api-checks.ts.
      - name: API smoke (/docs, /changelogs; no YouTube)
        if: hashFiles('src/e2e/api-checks.ts') != ''
        run: SMOKE_SKIP_BUILD=1 SMOKE_SKIP_MCP=1 SMOKE_SKIP_TRANSCRIPT=1 SMOKE_IMAGE_API=transcriptor-mcp-api:smoke npm run test:e2e:api

      - name: Build and push REST API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: ${{ steps.tag.outputs.api_tags }}
          platforms: linux/amd64,linux/arm64

      - name: Build and push MCP image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: mcp
          push: true
          tags: ${{ steps.tag.outputs.mcp_tags }}
          platforms: linux/amd64,linux/arm64

      - name: Log yt-dlp version in image
        run: |
          IMG="artsamsonov/transcriptor-mcp-api:${{ steps.tag.outputs.latest_only == 'true' && 'latest' || steps.tag.outputs.version }}"
          docker pull "$IMG"
          echo "::notice::yt-dlp in image $IMG: $(docker run --rm $IMG yt-dlp --version 2>/dev/null | head -1)"

  # Publish the server entry to registry.modelcontextprotocol.io.
  # Runs after `publish` because the registry validates ownership by pulling the
  # image and reading its io.modelcontextprotocol.server.name label.
  publish-registry:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for `mcp-publisher login github-oidc`
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Sync server.json to the released version
        run: |
          jq --arg v "${{ needs.publish.outputs.version }}" \
            '.version = $v
             | .packages[0].identifier = "docker.io/artsamsonov/transcriptor-mcp:" + $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      # This job holds an OIDC token for the registry, so it runs only a fixed, checked
      # binary (#135). mcp-publisher-check.yml reads MCP_PUBLISHER_VERSION from this file
      # and opens an issue when a newer release is out. To update: change both lines.
      # The sum is in registry_<version>_checksums.txt of the release.
      - name: Install mcp-publisher (fixed version, SHA-256 checked)
        env:
          MCP_PUBLISHER_VERSION: 1.8.21
          MCP_PUBLISHER_SHA256: ca2e5b24e8fc2718be4bb58ab086b39b7d60c79840c24b2057bc3f36d6ab2a59
        run: |
          set -euo pipefail
          f=mcp-publisher_linux_amd64.tar.gz
          curl -fsSLo "$f" "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/$f"
          echo "$MCP_PUBLISHER_SHA256  $f" | sha256sum -c -
          tar xzf "$f" mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # The Releases list follows the tags (#149): before this, GitHub showed v1.2.0 of
  # 2026-07-02 as the latest release, months after the newest tag.
  # This job runs after both images are pushed, so it cannot stop or delay a deploy.
  # It needs the CHANGELOG section of the version and fails without it.
  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create the GitHub Release with the CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          # A re-run of this job finds the release of the first run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists. Nothing to do."
            exit 0
          fi
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "::error::CHANGELOG.md has no section '## [$VERSION]'."; exit 1; }
          # Without --latest, GitHub marks each new release Latest, even a late tag of an older version.
          newest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | awk -F/ '{print $NF}' | sort -V | tail -1)
          latest=$([ "$TAG" = "$newest" ] && echo true || echo false)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest="$latest"
