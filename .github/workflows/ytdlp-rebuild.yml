# Rebuilds :latest when PyPI has a different yt-dlp than the image (#169).
# The image installs the newest yt-dlp at build time, so only a rebuild updates it.
# An outside n8n workflow did this before; it stopped without a sign after 2026-06-30.
# A rebuild restarts every deployment that pulls :latest, so this starts at most
# one publish run for each yt-dlp release.
name: yt-dlp rebuild

on:
  schedule:
    - cron: '17 5,17 * * *' # every 12 hours: a release reaches :latest in under a day
  workflow_dispatch:

permissions:
  actions: write # gh workflow run; GITHUB_TOKEN may start workflow_dispatch runs
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare yt-dlp in :latest with PyPI, start a latest_only publish if they differ
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: artsamsonov/transcriptor-mcp-api:latest
        run: |
          set -euo pipefail
          # PyPI drops leading zeros (2026.2.4), yt-dlp --version keeps them (2026.02.04).
          norm() { awk -F. '{ for (i = 1; i <= NF; i++) printf "%s%d", (i > 1 ? "." : ""), $i }' <<<"$1"; }
          valid() { [[ "$1" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::cannot read the $2 version: '$1'"; exit 1; }; }

          image=$(docker run --rm "$IMAGE" yt-dlp --version | head -1)
          pypi_json=$(curl -fsS https://pypi.org/pypi/yt-dlp/json)
          pypi=$(jq -r .info.version <<<"$pypi_json")
          valid "$image" image
          valid "$pypi" PyPI
          echo "::notice::yt-dlp in $IMAGE: $image; on PyPI: $pypi"
          if [ "$(norm "$image")" = "$(norm "$pypi")" ]; then
            echo "Up to date. Nothing to start."
            exit 0
          fi

          last=$(gh run list --workflow publish-docker.yml -L 1 --json status,createdAt,url -q '.[0] // empty')
          if [ -n "$last" ] && [ "$(jq -r .status <<<"$last")" != "completed" ]; then
            echo "::notice::A publish run is queued or in progress: $(jq -r .url <<<"$last"). The next check tries again."
            exit 0
          fi

          # A publish run that started after the upload already had its chance. Another
          # one would most likely end the same way and restart deployments every 12 hours.
          uploaded=$(jq -r '[.urls[].upload_time_iso_8601] | min' <<<"$pypi_json")
          if [ -n "$last" ] && [ "$(date -d "$(jq -r .createdAt <<<"$last")" +%s)" -gt "$(date -d "$uploaded" +%s)" ]; then
            echo "::error::PyPI has had yt-dlp $pypi since $uploaded, and $(jq -r .url <<<"$last") started after that, but $IMAGE still has $image. Check why that build did not install $pypi."
            exit 1
          fi

          gh workflow run publish-docker.yml -f latest_only=true
          echo "::notice::Started publish-docker.yml with latest_only=true for yt-dlp $pypi."
